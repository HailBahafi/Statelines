<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>try{var t=localStorage.getItem("statelines-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>Figures · statelines</title>
  <meta name="description" content="Browse all 100 statelines figures. Filter by shelf and see every state.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="top"></div>
  <main class="wrap">
    <header class="figures-head">
      <h1>Every figure, every state.</h1>
      <p class="muted">Hover a card to see it succeed and fail. Open one to tune it and copy the code.</p>
    </header>
    <div class="browse">
      <aside class="filters" aria-label="Filters">
        <div class="chips chips-col" id="chips" role="group" aria-label="Filter by shelf"></div>
      </aside>
      <section class="browse-main">
        <p class="count-line" id="count" aria-live="polite"></p>
        <div class="cards" id="cards"></div>
        <p class="empty-state" id="none" hidden>No figures on this shelf.</p>
      </section>
    </div>
  </main>
  <div id="foot"></div>
  <script type="module" src="/src/pages/figures.ts"></script>
</body>
</html>
