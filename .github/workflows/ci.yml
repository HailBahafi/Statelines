name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated files are current
        run: |
          python3 scripts/generate.py
          git diff --exit-code -- packages/momenta/src/react apps/site/src/data packages/momenta/test/lists.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
