name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated files are current
        run: |
          python3 scripts/generate.py
          git diff --exit-code -- packages/statelines/src/react apps/site/src/data packages/statelines/test/lists.ts
      - name: Library source changes have a changeset
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # Metadata-only release setup must not bump the initial unpublished version.
          if git diff --quiet "$BASE_REF" -- packages/statelines/src packages/statelines/tsup.config.ts; then
            echo "No library source or build changes need a changeset."
          else
            pnpm changeset status --since="$BASE_REF"
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the package can publish
        if: github.event_name == 'pull_request'
        run: pnpm --filter statelines publish --dry-run --no-git-checks
      - run: pnpm smoke:pack
