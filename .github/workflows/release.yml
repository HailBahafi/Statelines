name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Require npm publishing token
        env:
          NPM_TOKEN: ${{ secrets.STATELINES }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The STATELINES secret (the npm token) is empty. Add it as a repository secret before releasing."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # On push to main: opens a "Version Packages" pull request while changesets are pending,
      # and publishes unpublished versions when no changesets remain (including the first release).
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.STATELINES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.STATELINES }}
          NPM_CONFIG_PROVENANCE: "true"
